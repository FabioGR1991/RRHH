<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RRHH - Solicitud de Altas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-header-custom { background: #0066ff; color: white; font-weight: 600; }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-person-plus-fill me-2"></i>Portal RRHH</a>
            <div class="d-flex align-items-center">
                <span class="text-light me-3 small"><i class="bi bi-person-circle me-1"></i> Operador RRHH</span>
                <a href="/logout" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Salir</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 my-4">
        <div class="row g-4">
            
            <!-- Columna Izquierda: Formulario -->
            <div class="col-lg-5 col-12">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header card-header-custom p-3 rounded-top">
                        <i class="bi bi-file-earmark-text me-2"></i>Solicitud de Alta de Nuevo Empleado
                    </div>
                    <div class="card-body p-4">
                        <div id="alertMsg" class="alert d-none mb-3" role="alert"></div>

                        <form id="altaForm">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label small text-muted fw-bold">Nombre</label>
                                    <input type="text" id="nombre" class="form-control" placeholder="ej. Fabio" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small text-muted fw-bold">Apellido</label>
                                    <input type="text" id="apellido" class="form-control" placeholder="ej. Gomez" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small text-muted fw-bold">DNI</label>
                                    <input type="text" id="dni" class="form-control" placeholder="ej. 40123456" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small text-muted fw-bold">Legajo</label>
                                    <input type="text" id="legajo" class="form-control" placeholder="ej. 1339" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label small text-muted fw-bold">A quién reporta</label>
                                    <input type="text" id="reporta_a" class="form-control" placeholder="ej. Juan Pérez (Gerente)" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label small text-muted fw-bold">Perfil / Rol Asignado</label>
                                    <select id="perfil_ad" class="form-select" required>
                                        <option value="" selected disabled>Seleccionar perfil...</option>
                                        <option value="Operador">Operador</option>
                                        <option value="Administrativo">Administrativo</option>
                                        <option value="Supervisión">Supervisión</option>
                                        <option value="Gerencia">Gerencia</option>
                                    </select>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold">
                                        <i class="bi bi-send me-2"></i>Enviar Solicitud a IT
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Tabla de Solicitudes Enviadas -->
            <div class="col-lg-7 col-12">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-white p-3 d-flex justify-content-between align-items-center">
                        <h5 class="fw-bold mb-0 text-dark"><i class="bi bi-clock-history me-2"></i>Mis Solicitudes Enviadas</h5>
                        <button onclick="cargarMisSolicitudes()" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-3">#</th>
                                        <th>Empleado</th>
                                        <th>Legajo</th>
                                        <th>Reporta a</th>
                                        <th>Perfil</th>
                                        <th>Estado</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaMisSolicitudes">
                                    <tr>
                                        <td colspan="6" class="text-center py-4 text-muted">Cargando historial...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Cargar solicitudes en el panel de RRHH
        async function cargarMisSolicitudes() {
            try {
                const response = await fetch('/api/solicitudes');
                const data = await response.json();
                const tbody = document.getElementById('tablaMisSolicitudes');
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">No has generado solicitudes todavía.</td></tr>`;
                    return;
                }

                data.forEach(sol => {
                    const badgeClass = sol.estado === 'PENDIENTE' 
                        ? 'bg-warning text-dark' 
                        : 'bg-success';
                    const estadoTexto = sol.estado === 'PENDIENTE' 
                        ? '<i class="bi bi-hourglass-split me-1"></i> Pendiente IT' 
                        : '<i class="bi bi-check-circle me-1"></i> Aprobado';

                    tbody.innerHTML += `
                        <tr>
                            <td class="ps-3 fw-bold text-secondary">#${sol.id}</td>
                            <td>
                                <div class="fw-bold">${sol.nombre} ${sol.apellido}</div>
                                <div class="small text-muted">DNI: ${sol.dni}</div>
                            </td>
                            <td>${sol.legajo}</td>
                            <td><span class="small text-muted">${sol.reporta_a || 'N/A'}</span></td>
                            <td><span class="badge bg-secondary">${sol.perfil_ad}</span></td>
                            <td><span class="badge ${badgeClass}">${estadoTexto}</span></td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error('Error al cargar historial:', err);
            }
        }

        // Envío del Formulario
        document.getElementById('altaForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertMsg = document.getElementById('alertMsg');
            alertMsg.classList.add('d-none');

            const payload = {
                nombre: document.getElementById('nombre').value,
                apellido: document.getElementById('apellido').value,
                dni: document.getElementById('dni').value,
                legajo: document.getElementById('legajo').value,
                reporta_a: document.getElementById('reporta_a').value,
                perfil_ad: document.getElementById('perfil_ad').value
            };

            try {
                const response = await fetch('/api/solicitudes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const resData = await response.json();

                if (response.ok) {
                    alertMsg.className = "alert alert-success";
                    alertMsg.innerHTML = '<i class="bi bi-check-lg me-2"></i>Solicitud enviada con éxito a IT.';
                    alertMsg.classList.remove('d-none');
                    document.getElementById('altaForm').reset();
                    cargarMisSolicitudes(); // Refresca la tabla automáticamente
                } else {
                    alertMsg.className = "alert alert-danger";
                    alertMsg.textContent = resData.detail || 'Error al enviar la solicitud.';
                    alertMsg.classList.remove('d-none');
                }
            } catch (err) {
                alertMsg.className = "alert alert-danger";
                alertMsg.textContent = 'Error de conexión con el servidor.';
                alertMsg.classList.remove('d-none');
            }
        });

        // Inicializar
        cargarMisSolicitudes();
        // Sincronización automática cada 5 segundos para que RRHH vea cuando IT aprueba
        setInterval(cargarMisSolicitudes, 5000);
    </script>
</body>
</html>

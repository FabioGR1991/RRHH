<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel IT - Aprovisionamiento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-cpu me-2"></i>Panel IT / Sistemas</a>
            <div class="d-flex align-items-center">
                <span class="text-light me-3 small"><i class="bi bi-person-circle me-1"></i> Administrador IT</span>
                <a href="/logout" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right"></i> Salir</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-0">Solicitudes de Aprovisionamiento</h2>
                <p class="text-muted mb-0">Gestión e integración de altas para nuevos empleados.</p>
            </div>
            <button onclick="cargarSolicitudes()" class="btn btn-outline-primary btn-sm">
                <i class="bi bi-arrow-clockwise me-1"></i> Actualizar
            </button>
        </div>

        <div id="alertBox" class="alert alert-success d-none mb-3" role="alert"></div>

        <!-- Tabla de Solicitudes -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Empleado</th>
                                <th>DNI / Legajo</th>
                                <th>Perfil AD</th>
                                <th>Estado</th>
                                <th class="text-end pe-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaSolicitudes">
                            <tr>
                                <td colspan="6" class="text-center py-4 text-muted">Cargando solicitudes...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function cargarSolicitudes() {
            try {
                const response = await fetch('/api/solicitudes');
                const data = await response.json();
                const tbody = document.getElementById('tablaSolicitudes');
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">No hay solicitudes registradas aún.</td></tr>`;
                    return;
                }

                data.forEach(sol => {
                    const badgeClass = sol.estado === 'PENDIENTE' ? 'bg-warning text-dark' : 'bg-success';
                    tbody.innerHTML += `
                        <tr>
                            <td class="ps-4 fw-bold">#${sol.id}</td>
                            <td>
                                <div class="fw-bold">${sol.nombre} ${sol.apellido}</div>
                            </td>
                            <td>
                                <div class="small">DNI: ${sol.dni}</div>
                                <div class="small text-muted">Legajo: ${sol.legajo}</div>
                            </td>
                            <td><span class="badge bg-secondary">${sol.perfil_ad}</span></td>
                            <td><span class="badge ${badgeClass}">${sol.estado}</span></td>
                            <td class="text-end pe-4">
                                ${sol.estado === 'PENDIENTE' 
                                    ? `<button id="btn-${sol.id}" onclick="procesarSolicitud(${sol.id})" class="btn btn-sm btn-success"><i class="bi bi-check-circle me-1"></i> Aprobar / Crear</button>` 
                                    : `<span class="text-muted small"><i class="bi bi-check-all"></i> Procesado</span>`}
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error('Error cargando solicitudes:', err);
            }
        }

        async function procesarSolicitud(id) {
            const btn = document.getElementById(`btn-${id}`);
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Procesando...`;
            }

            try {
                const response = await fetch(`/api/solicitudes/${id}/aprobar`, {
                    method: 'POST'
                });

                const data = await response.json();
                const alertBox = document.getElementById('alertBox');

                if (response.ok) {
                    alertBox.textContent = `Solicitud #${id} aprobada y procesada en Active Directory correctamente.`;
                    alertBox.classList.remove('d-none');
                    setTimeout(() => alertBox.classList.add('d-none'), 4000);
                    cargarSolicitudes();
                } else {
                    alert('Error al procesar la solicitud: ' + (data.detail || 'Error desconocido'));
                    cargarSolicitudes();
                }
            } catch (err) {
                alert('Error de conexión con el servidor');
                cargarSolicitudes();
            }
        }

        // Carga inicial y auto-refresco
        cargarSolicitudes();
        setInterval(cargarSolicitudes, 5000);
    </script>
</body>
</html>
